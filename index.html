<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Europe Trip ❤️</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.svg" />
    <link
      href="https://cdn.jsdelivr.net/npm/pagedone@3.0.0/src/css/pagedone-v2.css "
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div
      id="bg"
      class="h-screen"
    >
      <div class="w-full h-full flex gap-9 flex-col items-center justify-center bg-cover bg-center">
        <div
          id="timerContainer"
          class="backdrop-blur-sm rounded-2xl text-center"
        >
          <h1 class="text-3xl">
            <span
              class="text-transparent bg-clip-text bg-gradient-to-r to-pink-600 from-indigo-500 text-3xl font-bold leading-tight"
              >Time until Europe Trip</span
            >
            ❤️
          </h1>

          <div
            class="flex items-center justify-center w-full gap-1.5 count-down-main"
          >
            <div class="timer">
              <div
                class="timer-square rounded-xl bg-gradient-to-b from-indigo-600 to-pink-600 py-3 flex items-center justify-center flex-col gap-1 aspect-square px-2"
              >
                <h3
                  class="countdown-element months font-manrope font-semibold text-2xl text-white text-center"
                ></h3>
                <p
                  class="timer-text text-me font-manrope font-normal text-white mt-1 text-center w-inherit"
                >
                  Months
                </p>
              </div>
            </div>
            <div class="timer">
              <div
                class="timer-square rounded-xl bg-gradient-to-b from-indigo-600 to-pink-600 py-3 flex items-center justify-center flex-col gap-1 aspect-square px-2"
              >
                <h3
                  class="countdown-element days font-manrope font-semibold text-2xl text-white text-center"
                ></h3>
                <p
                  class="timer-text text-me font-manrope font-normal text-white mt-1 text-center"
                >
                  Days
                </p>
              </div>
            </div>
            <div class="timer">
              <div
                class="timer-square rounded-xl bg-gradient-to-b from-indigo-600 to-pink-600 py-3 flex items-center justify-center flex-col gap-1 aspect-square px-2"
              >
                <h3
                  class="countdown-element hours font-manrope font-semibold text-2xl text-white text-center"
                ></h3>
                <p
                  class="timer-text text-me font-manrope font-normal text-white mt-1 text-center w-inherit"
                >
                  Hours
                </p>
              </div>
            </div>

            <div class="timer">
              <div
                class="timer-square rounded-xl bg-gradient-to-b from-indigo-600 to-pink-600 py-3 flex items-center justify-center flex-col gap-1 aspect-square px-2"
              >
                <h3
                  class="countdown-element minutes font-manrope font-semibold text-2xl text-white text-center"
                ></h3>
                <p
                  class="timer-text text-me font-manrope font-normal text-white mt-1 text-center w-inherit"
                >
                  Minutes
                </p>
              </div>
            </div>

            <div class="timer">
              <div
                class="timer-square rounded-xl bg-gradient-to-b from-indigo-600 to-pink-600 py-3 flex items-center justify-center flex-col gap-1 aspect-square px-2"
              >
                <h3
                  class="countdown-element seconds font-manrope font-semibold text-2xl text-white text-center"
                ></h3>
                <p
                  class="timer-text text-me font-manrope font-normal text-white mt-1 text-center w-inherit"
                >
                  Seconds
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/pagedone@3.0.0/src/js/pagedone.js"></script>
  <script src="script.js"></script>
</html>
